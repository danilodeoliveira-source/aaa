<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistindo: Martinho Lutero</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .tela-cinema {
            background-color: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        /* Ajustamos o CSS para o iframe manter a proporção do vídeo */
        iframe {
            border-radius: 8px;
            width: 800px;
            height: 450px;
            max-width: 100%;
        }

        h1 {
            color: #e50914; 
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="tela-cinema">
        <h1>Sessão Pipoca 🍿</h1>
        <p>Assistindo: Martinho Lutero (1953 - Dublado)</p>

        <!-- A tag iframe conecta o seu site com o servidor do YouTube -->
        <iframe 
            src="https://www.youtube.com/embed/faxYAslbfl8" 
            title="Filme Martinho Lutero"
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
